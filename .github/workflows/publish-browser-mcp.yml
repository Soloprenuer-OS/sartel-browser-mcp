name: Publish browser MCP

on:
  push:
    tags:
      - 'browser-mcp-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-browser-mcp-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Soloprenuer-OS/sartel-browser-mcp'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Match the release tag to the package
        run: |
          node -e 'const v=require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `browser-mcp-v${v}`) { console.error("Tag/package version mismatch"); process.exit(1) }'
          npm --version
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
